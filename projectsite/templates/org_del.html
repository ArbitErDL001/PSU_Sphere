{% extends 'base.html' %}

{% block title %}Delete Organization - PSU Sphere{% endblock %}

{% block content %}
<div class="container-fluid"><div class="row justify-content-center"><div class="col-lg-6"><div class="card"><div class="card-header"><div class="card-title">Delete organization</div></div><div class="card-body text-center"><i class="la la-warning text-danger la-3x"></i><h5 class="mt-3">Delete {{ organization.name }}?</h5><p class="text-muted">This action cannot be undone.</p><form method="post" class="d-flex justify-content-center">{% csrf_token %}<a href="{% url 'organization-list' %}" class="btn btn-light mr-2">Cancel</a><button type="submit" class="btn btn-danger"><i class="la la-trash"></i> Delete organization</button></form></div></div></div></div></div>
{% endblock %}
